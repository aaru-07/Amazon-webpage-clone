<!-- Save as bhai-dooj.html and open in your browser -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Happy Bhai Dooj</title>

  <!-- Optional: nice Google font (remove if offline) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#FFF7EE;
      --card:#FFFFFF;
      --accent:#FF6F61;    /* warm coral */
      --gold:#FFD166;      /* diya glow */
      --deep:#7B3F00;      /* wick base */
      --muted:#9E6B4B;
      --shadow: 0 10px 30px rgba(123,63,0,0.12);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:
        radial-gradient(circle at 10% 20%, rgba(255,209,102,0.08), transparent 10%),
        radial-gradient(circle at 90% 80%, rgba(255,111,97,0.04), transparent 10%),
        var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
    }

    .stage{
      width: min(920px, 96%);
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:28px;
      align-items:center;
    }

    /* responsive fallback */
    @media (max-width:880px){
      .stage{grid-template-columns: 1fr; text-align:center;}
      .side {order:-1;}
    }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.9), var(--card));
      border-radius:20px;
      padding:36px;
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
    }

    h1{
      margin:0 0 8px 0;
      font-size: clamp(24px, 3.5vw, 38px);
      color: var(--deep);
      letter-spacing: -0.02em;
    }

    p.lead{
      margin:0 0 18px 0;
      color: var(--muted);
      font-weight:500;
    }

    .btn{
      display:inline-block;
      padding:10px 18px;
      border-radius:12px;
      background: linear-gradient(90deg,var(--accent), #FF9478);
      color:white;
      text-decoration:none;
      font-weight:600;
      box-shadow: 0 8px 18px rgba(255,111,97,0.18);
      transform: translateY(0);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .btn:hover{ transform: translateY(-4px); box-shadow: 0 14px 30px rgba(255,111,97,0.2);}

    /* Diya side */
    .side{
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .diya-wrap{
      width:320px;
      height:320px;
      display:grid;
      place-items:center;
      position:relative;
    }

    /* base bowl */
    .diya{
      width:220px;
      height:120px;
      border-radius: 0 0 110px 110px;
      background: linear-gradient(180deg, #FFD79B, #FFB347);
      box-shadow: inset 0 -8px 18px rgba(0,0,0,0.06), 0 12px 30px rgba(255,150,60,0.14);
      position:relative;
      transform: rotate(-4deg);
    }

    /* decorative rangoli on bowl (CSS-only pattern) */
    .diya::before{
      content:'';
      position:absolute;
      left:18%;
      top:12%;
      width:65%;
      height:45%;
      background:
        radial-gradient(circle at 20% 30%, rgba(123,63,0,0.08) 0 6px, transparent 7px),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.06) 0 6px, transparent 6px 12px);
      border-radius:50%;
      transform: rotate(-6deg);
      opacity:0.95;
    }

    /* flame */
    .flame{
      position:absolute;
      bottom:68%;
      left:50%;
      transform: translateX(-50%);
      width:36px;
      height:56px;
      display:grid;
      place-items:center;
      filter: drop-shadow(0 8px 22px rgba(255,180,70,0.22));
      animation: sway 2s ease-in-out infinite;
    }
    .flame .inner{
      width:100%;
      height:100%;
      background: radial-gradient(circle at 30% 20%, #fff 0 10%, transparent 12%),
                  linear-gradient(180deg,#fff176 0%, #ffd166 40%, #ff9f43 65%, #ff6a00 100%);
      clip-path: polygon(50% 0, 70% 30%, 58% 60%, 50% 100%, 42% 60%, 30% 30%);
      border-radius:50%;
      transform-origin:50% 90%;
      animation: flicker 1.6s infinite;
    }
    /* tiny core */
    .flame .core{
      position:absolute;
      width:18px;height:28px;
      background: linear-gradient(180deg,#fff8d8,#ffd166);
      clip-path: polygon(50% 0, 72% 36%, 50% 100%, 28% 36%);
      opacity:0.98;
      left:50%;top:18%;
      transform:translateX(-50%);
    }

    @keyframes sway{
      0%{ transform: translateX(-50%) rotate(-1deg) }
      50%{ transform: translateX(-50%) rotate(3deg) }
      100%{ transform: translateX(-50%) rotate(-1deg) }
    }
    @keyframes flicker{
      0%{ transform: scaleY(1) translateY(0) }
      30%{ transform: scaleY(1.06) translateY(-1px) }
      60%{ transform: scaleY(0.96) translateY(0) }
      100%{ transform: scaleY(1) translateY(0) }
    }

    /* subtle confetti */
    .confetti{
      pointer-events:none;
      position:absolute;
      inset:0;
      overflow:hidden;
    }
    .confetti span{
      position:absolute;
      width:10px;height:10px;
      opacity:0.95;
      border-radius:2px;
      transform-origin:center;
      animation: fall linear infinite;
    }
    /* create several confetti using nth-child */
    .confetti span:nth-child(1){ left:8%;  background:#FFD166; animation-duration:6s; animation-delay:0s; }
    .confetti span:nth-child(2){ left:18%; background:#FF6F61; animation-duration:5.4s; animation-delay:-1s; }
    .confetti span:nth-child(3){ left:32%; background:#FF9478; animation-duration:7s; animation-delay:-2s; }
    .confetti span:nth-child(4){ left:44%; background:#FFD79B; animation-duration:6.8s; animation-delay:-1.4s; }
    .confetti span:nth-child(5){ left:56%; background:#C6A15A; animation-duration:5.6s; animation-delay:-0.6s; }
    .confetti span:nth-child(6){ left:68%; background:#FF6F61; animation-duration:6.4s; animation-delay:-2.2s; }
    .confetti span:nth-child(7){ left:80%; background:#FFD166; animation-duration:7.2s; animation-delay:-0.8s; }

    @keyframes fall{
      0%{ transform: translateY(-10vh) rotate(0deg); opacity:1 }
      100%{ transform: translateY(110vh) rotate(720deg); opacity:0.9 }
    }

    /* little petals / floral border */
    .floral {
      position:absolute;
      top:12px; right:12px;
      display:flex;
      gap:6px;
      transform: rotate(-8deg);
    }
    .petal{
      width:12px;height:18px;
      background: linear-gradient(180deg,#FFBFA0,#FF6F61);
      border-radius:6px 6px 12px 12px;
      transform: rotate(18deg);
      box-shadow: 0 6px 10px rgba(123,63,0,0.06);
      opacity:0.95;
    }

    /* greeting underline sparkle */
    .sparkle{
      display:inline-block;
      height:6px;
      width:120px;
      margin-left:10px;
      border-radius:999px;
      background: linear-gradient(90deg, rgba(255,255,255,0.5), rgba(255,255,255,0.1));
      box-shadow: 0 8px 22px rgba(255,209,102,0.14);
      vertical-align:middle;
      animation: glow 2.6s ease-in-out infinite;
    }
    @keyframes glow{
      0%{ transform: translateY(0) scaleX(1) }
      50%{ transform: translateY(-3px) scaleX(1.06) }
      100%{ transform: translateY(0) scaleX(1) }
    }

    /* small footer text */
    .note{
      margin-top:14px;
      font-size:13px;
      color: #7b5a48;
      opacity:0.9;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="card">
      <h1>Happy Bhai Dooj, dear brother 💛</h1>
      <p class="lead">Wishing you warmth, laughter, and all the little joys — today and always. Thank you for being my protector, my partner in mischief, and my favourite person to annoy. 🤗</p>

      <a class="btn" href="#">Send Love</a>

      <div class="note">Tip: Right-click → Save as to keep this card, or take a screenshot to share.</div>

      <!-- small floral decoration -->
      <div class="floral" aria-hidden="true">
        <div class="petal"></div>
        <div class="petal" style="transform: rotate(-6deg)"></div>
        <div class="petal" style="transform: rotate(12deg)"></div>
      </div>
    </div>

    <div class="side">
      <div class="diya-wrap" aria-hidden="true">
        <div class="diya"></div>

        <div class="flame" role="img" aria-label="lit diya">
          <div class="inner"></div>
          <div class="core"></div>
        </div>

        <div class="confetti" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
